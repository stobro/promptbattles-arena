<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prompt Battles Arena</title>
<style>
:root { --a: #22e3ff; --b: #ff3ea5; --bg: #07070f; --ink: #f4f6ff; --dim: #9aa0c4; --gold: #ffd84a; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, "Segoe UI", sans-serif;
  background-image: radial-gradient(circle at 20% 0%, rgba(34,227,255,.16), transparent 40%),
                    radial-gradient(circle at 80% 10%, rgba(255,62,165,.16), transparent 40%); background-attachment: fixed; }
header { text-align: center; padding: 48px 16px 24px; }
h1 { margin: 0; font-size: clamp(34px, 7vw, 64px); font-weight: 900; letter-spacing: -0.02em; line-height: 1; }
h1 .a { color: var(--a); } h1 .b { color: var(--b); }
header p { color: var(--dim); max-width: 60ch; margin: 14px auto 0; }
header a { color: var(--gold); }
main { max-width: 1100px; margin: 0 auto; padding: 16px; display: grid; gap: 18px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
article { background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.12); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
article h2 { margin: 0; font-size: 22px; }
.date { color: var(--dim); font-size: 13px; }
.tip { color: var(--gold); font-size: 14px; }
.play { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.play a { display: block; text-align: center; padding: 12px 8px; border-radius: 10px; font-weight: 800; text-decoration: none; color: #05050c; }
.play a.a { background: var(--a); } .play a.b { background: var(--b); }
.play a:hover, .play a:focus-visible { filter: brightness(1.15); outline: 2px solid #fff; }
.play span { display: block; text-align: center; padding: 12px 8px; border-radius: 10px; color: var(--dim); border: 1px dashed rgba(255,255,255,.2); }
details { font-size: 14px; color: var(--dim); } summary { cursor: pointer; color: var(--ink); }
.watch { color: var(--gold); font-size: 14px; }
</style>
</head>
<body>
<header>
  <h1><span class="a">ONE PROMPT.</span> <span class="b">TWO AIs.</span></h1>
  <p>Every game and tool here was written by an AI model from a single prompt, in one shot, with no fixes.
  Play both versions and decide who won. New battles every week on
  <a id="channel" href="https://www.youtube.com/@onepromptbattles">YouTube</a>.</p>
</header>
<main id="list"></main>
<script>
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
fetch("episodes.json", { cache: "no-store" }).then(r => r.json()).then(eps => {
  const list = document.getElementById("list");
  for (const ep of eps.slice().reverse()) {
    const card = el("article");
    card.append(el("div", "date", ep.date), el("h2", "", ep.title));
    if (ep.play_tip) card.append(el("div", "tip", ep.play_tip));
    const play = el("div", "play");
    for (const k of ["a", "b"]) {
      const m = ep.models[k];
      if (m.playable) { const a = el("a", k, "Play: " + m.label); a.href = ep.id + "/" + k + ".html"; play.append(a); }
      else play.append(el("span", "", m.label + " shipped nothing"));
    }
    card.append(play);
    const d = el("details"); d.append(el("summary", "", "The exact prompt"), el("p", "", ep.prompt)); card.append(d);
    if (ep.video) { const w = el("a", "watch", "Watch the battle"); w.href = "https://youtu.be/" + ep.video; card.append(w); }
    list.append(card);
  }
});
</script>
</body>
</html>
