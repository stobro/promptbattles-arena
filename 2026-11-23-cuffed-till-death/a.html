<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Cuffed Till Death</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10101e}
canvas{display:block;width:100%;height:100%;outline:none;touch-action:none}
</style>
</head>
<body>
<canvas id="game" aria-label="Cuffed Till Death. Arrow keys move both newlyweds, Space jumps, Z and X attack or throw, C swings your partner, and Shift pulls the chain taut."></canvas>
<script>
'use strict';
const canvas=document.getElementById('game'),g=canvas.getContext('2d');
const W=960,H=720,TOP=398,BOT=623,END=1810;
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n)), mix=(a,b,t)=>a+(b-a)*t;
const rand=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.floor(Math.random()*a.length)];
const TAU=Math.PI*2;
let vw,vh,scale,ox,oy,dpr;
function resize(){
  vw=innerWidth;vh=innerHeight;dpr=Math.min(2,devicePixelRatio||1);
  canvas.width=Math.round(vw*dpr);canvas.height=Math.round(vh*dpr);
  scale=Math.min(vw/W,vh/H);ox=(vw-W*scale)/2;oy=(vh-H*scale)/2;
}
addEventListener('resize',resize);resize();

const STAGES=[
  {name:'LAST CALL LANE',short:'LAST CALL',sub:'01 / THE RECEPTION DISTRICT',sky:'#22213f',far:'#39304e',near:'#514061',wall:'#362742',road:'#302941',line:'#59425c',hot:'#ff799f',cool:'#78f6e3',signs:['LAST CALL','KARAOKE','OPEN LATE'],waves:[['punk','dash','punk'],['guard','punk','pitch'],['dash','guard','heavy']]},
  {name:'THE BOTTLE MARKET',short:'MARKET',sub:'02 / CASH ONLY. NO REFUNDS.',sky:'#183740',far:'#275357',near:'#38615e',wall:'#233d42',road:'#24393c',line:'#45605b',hot:'#ffce78',cool:'#79ffca',signs:['NIGHT MART','FRUIT','COLD SODA'],waves:[['pitch','punk','dash'],['guard','pitch','skate','punk'],['heavy','dash','skate','guard']]},
  {name:'VOWS ON THE VIADUCT',short:'VIADUCT',sub:'03 / NO U-TURNS',sky:'#302545',far:'#54416b',near:'#634b75',wall:'#362e51',road:'#332f48',line:'#5b506f',hot:'#ffae74',cool:'#aaa5ff',signs:['EXIT 03','TOLL','CHAPEL →'],waves:[['skate','skate','pitch'],['heavy','guard','dash','pitch'],['heavy','skate','guard','dash']]},
  {name:'TILL DEATH CHAPEL',short:'CHAPEL',sub:'04 / HERE COMES TROUBLE',sky:'#322038',far:'#513450',near:'#684460',wall:'#462e49',road:'#382b42',line:'#68435c',hot:'#ff87bd',cool:'#ffe5a0',signs:['CHAPEL','WEDDINGS','TONIGHT'],waves:[['guard','heavy','dash'],['skate','pitch','guard','heavy'],['boss']]}
];
const TYPES={
  punk:{name:'THE HECKLER',hp:40,speed:105,color:'#fa806e',tell:.37,dmg:7,range:57,points:100},
  dash:{name:'SPRINT PUNK',hp:32,speed:163,color:'#f5c65b',tell:.47,dmg:8,range:123,points:140},
  heavy:{name:'BOUNCER',hp:87,speed:72,color:'#da89ff',tell:.70,dmg:15,range:78,points:240},
  pitch:{name:'BOTTLE TOSSER',hp:39,speed:99,color:'#7de7ad',tell:.62,dmg:7,range:252,points:170},
  guard:{name:'DOORMAN',hp:62,speed:90,color:'#79baff',tell:.52,dmg:10,range:66,points:190},
  skate:{name:'CURB ROLLER',hp:49,speed:132,color:'#ff92be',tell:.55,dmg:9,range:132,points:200},
  boss:{name:'THE BEST MAN',hp:390,speed:105,color:'#fcd289',tell:.65,dmg:14,range:91,points:1500}
};
const GEAR=[
  {name:'BOUQUET',c:'#ff82ae',hits:5,dmg:7,reach:21},
  {name:'CAKE KNIFE',c:'#e9f4ff',hits:5,dmg:12,reach:12},
  {name:'FOLDING CHAIR',c:'#8fe6ef',hits:4,dmg:16,reach:30},
  {name:'CHAMPAGNE',c:'#b8ea88',hits:3,dmg:13,reach:18}
];
const keys=new Set(),command=[];
let lastInput=performance.now(),auto=false,botHand=0,botWait=0,botJump=0;
let stage,score,combo,best,lastHand,comboTime,cam,px,py,facing,spread,taut,players,enemies,crates,drops,shots,fx,texts;
let wave,waveLive,gate,banner,clearTime,mode,endTime,shake,stop,clock,sim,flail,notice,noticeTime,spawnId;
const markers=[490,1000,1480];
function player(i){return {i,x:0,y:0,z:0,vz:0,hp:100,inv:0,cool:0,pose:0,flash:0,gear:null,held:null,lunge:0};}
function loadStage(){
  px=185;py=519;cam=0;facing=1;spread=0;taut=false;flail=null;
  enemies=[];shots=[];crates=[];drops=[];fx=[];texts=[];wave=0;waveLive=false;gate=0;clearTime=0;banner=2.8;
  for(const p of players){p.x=px+(p.i?29:-29);p.y=py+(p.i?-11:11);p.z=0;p.vz=0;p.held=null;p.lunge=0;p.pose=0;p.inv=.5;}
  for(let i=0;i<6;i++) crates.push({x:[315,570,796,1100,1290,1545][i],y:[517,591,501,570,488,570][i],kind:(i+stage)%4,hp:2});
  notice='';noticeTime=0;
}
function reset(){
  stage=0;score=0;combo=0;best=0;lastHand=-1;comboTime=0;mode='play';endTime=0;shake=0;stop=0;
  clock=clock||0;sim=0;players=[player(0),player(1)];spawnId=0;botHand=0;botWait=0;botJump=0;command.length=0;loadStage();
}
reset();
const control=new Set(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space','KeyZ','KeyX','KeyC','ShiftLeft','ShiftRight']);
addEventListener('keydown',e=>{
  if(!e.metaKey&&!e.ctrlKey&&!e.altKey)lastInput=performance.now();
  wakeAudio();
  if(!control.has(e.code))return;
  e.preventDefault();
  if(!keys.has(e.code)&&['Space','KeyC','KeyZ','KeyX'].includes(e.code))command.push(e.code);
  keys.add(e.code);
});
addEventListener('keyup',e=>{keys.delete(e.code);if(control.has(e.code))e.preventDefault();});
addEventListener('blur',()=>{keys.clear();command.length=0;});
addEventListener('pointerdown',wakeAudio);

// The entire soundtrack and every impact are synthesized.
let ac,bus,music,sfx,nextBeat=0,beat=0,noiseBuffer;
function wakeAudio(){
  try{
    if(!ac){
      const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return;
      ac=new Audio();bus=ac.createDynamicsCompressor();bus.connect(ac.destination);
      music=ac.createGain();music.gain.value=.32;music.connect(bus);
      sfx=ac.createGain();sfx.gain.value=.48;sfx.connect(bus);
      noiseBuffer=ac.createBuffer(1,ac.sampleRate*.4,ac.sampleRate);
      const b=noiseBuffer.getChannelData(0);for(let i=0;i<b.length;i++)b[i]=Math.random()*2-1;
    }
    if(ac.state!=='running')ac.resume().catch(()=>{});
  }catch(_){}
}
function tone(t,f,to,d,v,type,channel){
  if(!ac)return;
  const o=ac.createOscillator(),a=ac.createGain();o.type=type;
  o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(Math.max(12,to),t+d);
  a.gain.setValueAtTime(.001,t);a.gain.linearRampToValueAtTime(v,t+.006);
  a.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(a);a.connect(channel);o.start(t);o.stop(t+d+.01);
}
function noise(t,d,v,cut,channel){
  const o=ac.createBufferSource(),f=ac.createBiquadFilter(),a=ac.createGain();
  o.buffer=noiseBuffer;f.type='bandpass';f.frequency.value=cut;f.Q.value=.7;
  a.gain.setValueAtTime(v,t);a.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(f);f.connect(a);a.connect(channel);o.start(t);o.stop(t+d+.01);
}
function sound(k){
  if(!ac||ac.state!=='running')return;
  const t=ac.currentTime;
  if(k==='hit'||k==='heavy'||k==='hurt'){
    const heavy=k!=='hit';
    tone(t,heavy?141:225,heavy?39:77,heavy?.20:.105,.29,'triangle',sfx);
    noise(t,heavy?.17:.075,.29,k==='hurt'?470:1300,sfx);
  }else if(k==='swing'||k==='jump'){
    tone(t,k==='jump'?160:520,k==='jump'?490:115,.16,.13,'triangle',sfx);
    if(k==='swing')noise(t,.15,.13,900,sfx);
  }else if(k==='break'){
    noise(t,.27,.35,790,sfx);tone(t,114,33,.15,.24,'triangle',sfx);
  }else if(k==='block'){
    tone(t,950,550,.11,.15,'square',sfx);noise(t,.06,.11,3900,sfx);
  }else{
    const seq=k==='win'?[392,494,587,784,988]:k==='phase'?[196,147,110]:[440,660,880];
    seq.forEach((f,i)=>tone(t+i*.075,f,f,.23,.14,'triangle',sfx));
  }
}
function soundtrack(){
  if(!ac||ac.state!=='running')return;
  if(nextBeat<ac.currentTime-.2)nextBeat=ac.currentTime+.02;
  while(nextBeat<ac.currentTime+.13){
    const s=beat%16,bass=[0,0,12,0,3,0,7,0,0,0,10,0,5,0,7,10],root=[48,43,46,45][stage];
    const hz=n=>440*Math.pow(2,(n-69)/12),t=nextBeat;
    if([0,3,6,8,10,14].includes(s))tone(t,116,39,.15,.54,'sine',music);
    if(s===4||s===12){noise(t,.13,.30,1550,music);tone(t,177,70,.10,.20,'triangle',music);}
    noise(t,s%4===2?.085:.040,s%2?.085:.14,7500,music);
    const f=hz(root-12+bass[s]);tone(t,f,f*.995,.118,.24,'triangle',music);
    if([0,2,3,7,8,11,14].includes(s)){
      const melody=[12,19,15,22,19,15,24,22,12,15,19,27,22,19,15,10];
      tone(t,hz(root+melody[s]),hz(root+melody[s]),.16,s%2?.050:.073,'square',music);
    }
    if(s===0||s===8)for(const n of [0,3,7])tone(t,hz(root+n),hz(root+n),.52,.07,'sine',music);
    const boss=enemies.find(e=>e.kind==='boss'&&!e.dead);
    nextBeat+=60/(boss?143+boss.phase*10:126+stage*4)/4;beat++;
  }
}
wakeAudio();

function burst(x,y,z,c,n=12,s=1,shape='spark'){
  for(let i=0;i<n;i++){
    const life=rand(.21,.62),a=rand(0,TAU),v=rand(28,196)*s;
    fx.push({x,y,z,vx:Math.cos(a)*v,vy:Math.sin(a)*v*.36,vz:rand(45,240)*s,c,life,max:life,r:rand(2,5)*s,a,shape});
  }
}
function label(x,y,z,msg,c='#fff4d6',size=17){texts.push({x,y,z,msg,c,size,life:.8});}
function say(msg){notice=msg;noticeTime=1.65;}
function enemy(kind,x,y){
  const t=TYPES[kind];
  return {id:spawnId++,kind,t,x,y,hp:t.hp,dir:-1,stun:0,flash:0,mode:'hunt',timer:0,cool:rand(.12,.62),age:rand(0,6),phase:1,turn:0,dead:false,fade:0,trip:0,kx:0,ky:0,z:0,vz:0,held:false,thrown:false,ax:0,ay:0,move:'',serial:0,targets:new Set()};
}
function startWave(){
  waveLive=true;gate=markers[wave];say(wave===2&&stage===3?'THE BEST MAN HAS YOUR RINGS':'CRASHERS INCOMING');
  const list=STAGES[stage].waves[wave];
  list.forEach((k,i)=>{
    const side=i===2||i===4?-1:1;
    const x=k==='boss'?gate+246:gate+side*(194+i*26);
    const e=enemy(k,clamp(x,78,END+75),k==='boss'?514:440+(i*47)%158);
    enemies.push(e);burst(e.x,e.y,1,TYPES[k].color,8,.6,'dust');
  });
  if(stage===3&&wave===2)sound('phase');
}
function stageAdvance(){
  score+=500;players.forEach(p=>p.hp=Math.min(100,p.hp+39));
  stage++;loadStage();sound('pickup');
}
function finish(win){
  mode=win?'win':'over';endTime=win?8.5:4.2;flail=null;stop=0;
  if(win){score+=2500;sound('win');for(let i=0;i<16;i++)burst(px+rand(-170,170),py+rand(-60,60),rand(25,140),pick(['#ffe598','#ff83b3','#78ffe2','#ffffff']),12,1.05,'confetti');}
  else sound('phase');
}
function distance(a,b){return Math.hypot(a.x-b.x,(a.y-b.y)*1.85);}
function downEnemy(e){
  if(e.dead)return;
  e.dead=true;e.fade=.65;e.held=false;e.thrown=false;e.z=0;
  score+=e.t.points+Math.max(0,combo-1)*15;
  label(e.x,e.y,58,'+'+e.t.points,'#ffe7a5',15);
  burst(e.x,e.y,30,e.t.color,21,1.2);
  if(e.kind==='boss'){
    drops.push({x:e.x,y:e.y,kind:'rings',age:0});say('RINGS RECOVERED');finish(true);
  }else if((e.id+2)%6===0)drops.push({x:e.x,y:e.y,kind:'heart',age:0});
}
function hitEnemy(e,dmg,dir,power,tag,source){
  if(e.dead||e.held||e.mode==='phase')return false;
  if(e.kind==='guard'&&e.stun<=0&&e.mode==='hunt'&&source&&Math.sign(source.x-e.x)===e.dir&&power<2){
    e.cool=.18;e.mode='guard';e.timer=.28;
    burst(e.x+e.dir*20,e.y,35,'#9beaff',7,.65);
    label(e.x,e.y,64,'BLOCK','#a5ecff',12);sound('block');shake=Math.max(shake,3);return false;
  }
  e.hp-=dmg;e.flash=.12;e.stun=e.kind==='boss'?.13:power>=2?.76:.33;
  e.mode='hunt';e.cool=e.kind==='boss'?.36:.38;e.kx=dir*(power>=2?153:86);e.ky=source?(e.y-source.y)*2:0;
  burst(e.x-dir*10,e.y,35,tag||'#fff0ae',power>=2?17:9,power>=2?1.05:.8);
  shake=Math.max(shake,power>=2?10:5);stop=Math.max(stop,power>=2?.066:.038);sound(power>=2?'heavy':'hit');
  if(e.hp<=0)downEnemy(e);
  return true;
}
function hurt(p,dmg,dir){
  if(p.inv>0||p.z>25||p.hp<=0||mode!=='play')return;
  if(p.held){p.held.held=false;p.held.stun=.4;p.held=null;}
  p.hp=Math.max(0,p.hp-dmg);p.inv=.77;p.flash=.27;p.lunge=dir*27;
  combo=0;lastHand=-1;comboTime=0;score=Math.max(0,score-15);
  shake=Math.max(shake,11);stop=Math.max(stop,.067);
  burst(p.x,p.y,35,'#ff557d',15,1);sound('hurt');
  if(players.every(q=>q.hp<=0))finish(false);
}
function crack(c,power){
  if(c.hp<=0)return;
  c.hp-=power;
  burst(c.x,c.y,21,'#f8a867',c.hp>0?7:17,1);
  if(c.hp<=0){drops.push({x:c.x,y:c.y,kind:c.kind,age:0});score+=35;sound('break');shake=Math.max(shake,6);}
  else sound('hit');
}
function register(i){
  combo=comboTime>0&&lastHand!==i?combo+1:1;lastHand=i;comboTime=1.55;best=Math.max(best,combo);
}
function attack(i){
  const p=players[i];if(p.hp<=0||p.cool>0||flail||mode!=='play')return false;
  if(p.held){
    const e=p.held;p.held=null;e.held=false;e.thrown=true;e.throwTime=.49;e.targets=new Set();e.x=p.x+facing*25;e.y=p.y;e.z=38;e.vz=160;e.kx=550*facing;e.ky=-15;
    e.hp-=24;e.flash=.12;e.stun=.9;if(e.hp<=0)e.doomed=true;
    p.pose=.25;p.cool=.29;score+=60;register(i);label(p.x,p.y,90,'JUST TOSSED!','#ffe1bf');sound('swing');return true;
  }
  const alternating=lastHand!==i&&lastHand!==-1&&comboTime>0,step=alternating?combo+1:1;
  const finisher=step>1&&step%3===0;
  const gear=p.gear, item=gear?GEAR[gear.kind]:null;
  p.pose=.23;p.cool=alternating?.24:.32;p.lunge=facing*(finisher?39:24);
  const reach=(i===0?80:86)+(item?item.reach:0)+(finisher?17:0);
  let hits=0,contact=false;
  const targets=enemies.filter(e=>!e.dead&&!e.held&&!e.thrown&&e.z<35&&Math.abs(e.y-p.y)<(finisher?49:40)&&Math.abs(e.x-p.x)<reach&&(e.x-p.x)*facing>-(finisher?41:25));
  for(const e of targets){
    contact=true;
    if(hitEnemy(e,(i===0?13:16)+(item?item.dmg:0)+(alternating?4:0)+(finisher?10:0),facing,finisher||(gear&&gear.kind===2)?2:1,item?item.c:i===0?'#ff9cbe':'#89fff0',p))hits++;
  }
  for(const c of crates)if(c.hp>0&&Math.abs(c.y-p.y)<41&&Math.abs(c.x-p.x)<reach&&(c.x-p.x)*facing>-20){crack(c,item||finisher?2:1);contact=true;}
  if(gear&&contact&&--gear.hits<=0){burst(p.x+facing*25,p.y,42,item.c,10,.8);p.gear=null;}
  if(hits){
    register(i);score+=hits*(20+combo*4);
    if(finisher)label(p.x,p.y,96,combo>=6?'WEDDING CRASH!':'TANDEM CRASH!','#fff1a4',21);
  }else if(!contact)sound('swing');
  return true;
}
function startFlail(){
  if(flail||mode!=='play')return false;
  const a=players[0].hp>0?players[0]:players[1],b=players[1-a.i];
  if(a.hp<=0||b.hp<=0||a.z>8||b.z>8||players.some(p=>p.cool>.10||p.held))return false;
  flail={t:0,max:.58,a,b,hit:new Set(),cracked:new Set()};
  a.inv=Math.max(a.inv,.67);b.inv=Math.max(b.inv,.67);sound('swing');
  label(px,py,99,'FIRST DANCE!','#ffb9da',20);return true;
}
function jump(){
  if(flail||mode!=='play'||players.some(p=>p.z>1))return;
  for(const p of players)if(p.hp>0){p.vz=365;p.inv=Math.max(p.inv,.15);burst(p.x,p.y,2,'#ac91ad',5,.5,'dust');}
  sound('jump');
}
function throwShot(e,p,angle=0){
  const a=Math.atan2((p.y-e.y)*1.35,p.x-e.x)+angle;
  shots.push({x:e.x,y:e.y,z:e.kind==='boss'?14:25,vx:Math.cos(a)*(e.kind==='boss'?375:315),vy:Math.sin(a)*235,t:1.55,color:e.t.color,damage:e.t.dmg});
}
function enemiesStep(dt){
  for(const e of enemies){
    e.age+=dt;e.flash=Math.max(0,e.flash-dt);e.trip=Math.max(0,e.trip-dt);
    if(e.dead){e.fade-=dt;continue;}
    if(e.held)continue;
    if(e.thrown){
      e.x+=e.kx*dt;e.y+=e.ky*dt;e.z=Math.max(0,e.z+e.vz*dt);e.vz-=870*dt;e.throwTime-=dt;
      for(const other of enemies)if(other!==e&&!other.dead&&!e.targets.has(other.id)&&distance(e,other)<53){
        e.targets.add(other.id);hitEnemy(other,31,Math.sign(e.kx),2,'#ffcc94');score+=35;
      }
      if(e.z<=0||e.throwTime<=0){e.z=0;e.thrown=false;e.kx=0;burst(e.x,e.y,3,'#e8aaad',12,1,'dust');if(e.doomed)downEnemy(e);}
      continue;
    }
    e.x=clamp(e.x+e.kx*dt,42,END+90);e.y=clamp(e.y+e.ky*dt,TOP-4,BOT+4);
    e.kx*=Math.pow(.003,dt);e.ky*=Math.pow(.004,dt);
    if(e.kind==='boss'){
      const phase=e.hp<=e.t.hp*.33?3:e.hp<=e.t.hp*.66?2:1;
      if(phase>e.phase){
        e.phase=phase;e.mode='phase';e.stun=0;e.timer=.92;shots=[];sound('phase');shake=17;
        burst(e.x,e.y,38,'#ffd07d',45,1.6);say(phase===2?'PHASE II / TOAST OF TERROR':'PHASE III / LAST VOW');
      }
    }
    if(e.stun>0){e.stun-=dt;continue;}
    const p=players.filter(p=>p.hp>0).sort((a,b)=>distance(e,a)-distance(e,b))[0];
    if(!p)continue;
    const dx=p.x-e.x,dy=p.y-e.y,d=distance(e,p);
    e.cool=Math.max(0,e.cool-dt);
    if(e.mode==='phase'){
      e.timer-=dt;if(e.timer<=0){e.mode='hunt';e.cool=.32;}
      continue;
    }
    if(e.mode==='guard'){e.timer-=dt;if(e.timer<=0)e.mode='hunt';continue;}
    if(e.mode==='tell'){
      e.timer-=dt;
      if(e.timer>0)continue;
      e.mode='strike';e.targets.clear();e.serial++;
      if(e.move==='volley'||e.move==='toss'){
        if(e.move==='volley')for(const a of [-.34,0,.34])throwShot(e,p,a);
        else throwShot(e,p);
        sound('swing');e.timer=.22;
      }else {
        e.timer=e.move==='rush'?.33:e.move==='slam'?.22:.14;
        if(e.move==='slam'){burst(e.x,e.y,3,e.t.color,19,1.25,'dust');shake=Math.max(shake,8);sound('heavy');}
        else sound('swing');
      }
    }
    if(e.mode==='strike'){
      e.timer-=dt;
      if(e.move==='rush'){
        e.x=clamp(e.x+e.ax*dt,42,END+82);e.y=clamp(e.y+e.ay*dt,TOP,BOT);
      }
      if(e.move!=='toss'&&e.move!=='volley'){
        const wide=e.move==='slam'?(e.kind==='boss'?109:82):e.move==='rush'?54:64;

  const shade=g.createLinearGradient(0,573,0,674);shade.addColorStop(0,'#100f1d00');shade.addColorStop(1,'#100f1d5e');box(0,573,W,101,shade);
  hud();g.restore();
}
let previous=performance.now();
function frame(now){
  const dt=Math.min(.034,Math.max(0,(now-previous)/1000));previous=now;
  update(dt);soundtrack();draw();requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
